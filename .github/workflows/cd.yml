name: CD

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Read version from csproj
        id: ver
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/AzurePostgresFlexibleAutoSleep/AzurePostgresFlexibleAutoSleep.csproj | head -1)
          if [ -z "$version" ]; then
            echo "::error::No <Version> found in csproj"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check if tag already exists
        id: tag
        run: |
          tag="v${{ steps.ver.outputs.value }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & test
        if: steps.tag.outputs.exists == 'false'
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        if: steps.tag.outputs.exists == 'false'
        run: dotnet pack src/AzurePostgresFlexibleAutoSleep/AzurePostgresFlexibleAutoSleep.csproj -c Release --no-build -o ./nupkgs

      - name: Push tag
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Login to NuGet
        if: steps.tag.outputs.exists == 'false'
        uses: NuGet/login@v1
        with:
          usernameVar: NUGET_USER
          tokenVar: NUGET_TOKEN

      - name: Push to NuGet
        if: steps.tag.outputs.exists == 'false'
        run: dotnet nuget push "./nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.ver.outputs.value }}"
          gh release create "$tag" ./nupkgs/*.nupkg --title "$tag" --generate-notes
