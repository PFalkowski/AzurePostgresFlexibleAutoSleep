name: release
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: ver
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: dotnet restore src/AzurePostgresFlexibleAutoSleep/AzurePostgresFlexibleAutoSleep.csproj
      - run: dotnet pack src/AzurePostgresFlexibleAutoSleep/AzurePostgresFlexibleAutoSleep.csproj -c Release -o ./nupkgs -p:Version=${{ steps.ver.outputs.value }}
      - run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
